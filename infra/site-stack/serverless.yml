service: examination-site

frameworkVersion: "3"

plugins:
  - "@silvermine/serverless-plugin-cloudfront-lambda-edge"

provider:
  name: aws
  # Lambda@Edgeはus-east-1へのデプロイが必須（CloudFrontが各エッジへ自動複製する）
  region: us-east-1
  stage: prod
  runtime: nodejs20.x
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - !GetAtt AllowedEmailsTable.Arn
            - !GetAtt LineLinkCodesTable.Arn
            - !GetAtt VoiceTokensTable.Arn
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt VoiceTokenIssuanceTable.Arn

functions:
  checkAuth:
    handler: functions/checkAuth.handler
    memorySize: 128
    timeout: 5
    # /_callback・/_logout・/_admin/emails・/_link-line・/_voice-tokenは
    # リクエストのたびに結果が変わる動的エンドポイントのため、DefaultCacheBehavior
    # （静的コンテンツ向け）とは別に、これらのPathPatternに対応するCacheBehaviors
    # （下記resources参照、CachingDisabled）へもこの関数を関連付ける必要がある
    # （examination#143）。1つの関数を複数のキャッシュビヘイビアへ関連付ける場合、
    # lambdaAtEdgeは配列で指定する（プラグインのREADME参照）
    lambdaAtEdge:
      - distribution: "SiteDistribution"
        eventType: "viewer-request"
        # 許可メールアドレスの登録・削除API（POST /_admin/emails）でJSONボディを
        # 読み取るために必要（既定はfalseでボディが渡されない）
        includeBody: true
      - distribution: "SiteDistribution"
        eventType: "viewer-request"
        pathPattern: "_callback"
        includeBody: true
      - distribution: "SiteDistribution"
        eventType: "viewer-request"
        pathPattern: "_logout"
        includeBody: true
      - distribution: "SiteDistribution"
        eventType: "viewer-request"
        pathPattern: "_admin/emails"
        includeBody: true
      - distribution: "SiteDistribution"
        eventType: "viewer-request"
        pathPattern: "_link-line"
        includeBody: true
      - distribution: "SiteDistribution"
        eventType: "viewer-request"
        pathPattern: "_voice-token"
        includeBody: true

resources:
  Resources:
    # サイトの閲覧を許可するメールアドレス一覧。checkAuth.jsが参照し、既に許可された
    # ユーザーが/_admin/emailsで登録・削除できる（初期値はcd.ymlのシード処理で投入）
    AllowedEmailsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-allowed-emails
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # LINE bot（examination#43、examination-bot-stack）とGoogleアカウントを紐付けるための
    # ワンタイムコード。checkAuth.jsが発行し、bot-stackのlineWebhook.jsがクロススタックで
    # 読み取り・削除する（examination#49）。TTLで自動失効させる
    LineLinkCodesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-line-link-codes
        AttributeDefinitions:
          - AttributeName: code
            AttributeType: S
        KeySchema:
          - AttributeName: code
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # 音声対話ページ（examination#62）用の短期トークン。checkAuth.jsが/_voice-tokenで
    # 発行し、bot-stackのvoiceChat.jsがクロススタックで検証する。TTLで自動失効させる
    VoiceTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-voice-tokens
        AttributeDefinitions:
          - AttributeName: token
            AttributeType: S
        KeySchema:
          - AttributeName: token
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # /_voice-tokenの1日あたりの発行回数カウンタ（examination#69）。パーティションキーは
    # "email#YYYY-MM-DD"の複合文字列とし、UpdateItem(ADD + ConditionExpression)で
    # アトミックにインクリメント・上限判定する。TTLで日付が変わった古いカウンタを自動失効させる
    VoiceTokenIssuanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-voice-token-issuance
        AttributeDefinitions:
          - AttributeName: emailDate
            AttributeType: S
        KeySchema:
          - AttributeName: emailDate
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    SiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${param:bucketName, 'bamiyanapp-examination-knowledge'}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    CloudFrontOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: examination-site-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    SiteDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - Id: s3origin
              DomainName: !GetAtt SiteBucket.RegionalDomainName
              S3OriginConfig: {}
              OriginAccessControlId: !Ref CloudFrontOAC
          DefaultCacheBehavior:
            TargetOriginId: s3origin
            ViewerProtocolPolicy: redirect-to-https
            # Managed-CachingOptimized（AWSマネージドポリシー、全アカウント共通の固定ID）
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
            # 許可メールアドレスの登録・削除API（POST /_admin/emails）のために
            # POSTを許可する（CloudFrontはGET/HEAD以外を既定でキャッシュしないため
            # キャッシュポリシーへの影響は無い）。CloudFrontのAllowedMethodsは
            # [HEAD,GET] / [HEAD,GET,OPTIONS] / [HEAD,DELETE,POST,GET,OPTIONS,PUT,PATCH]
            # の3パターンしか許可しないため、POSTを含める場合は全7メソッドを指定する
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
          # /_callback・/_logout・/_admin/emails・/_link-line・/_voice-tokenは
          # checkAuth.jsが毎回異なる結果（認可コード交換、ログイン状態に応じたJSON等）を
          # 返す動的エンドポイントだが、DefaultCacheBehaviorのManaged-CachingOptimizedは
          # クエリ文字列・Cookieをキャッシュキーに含めずURLパスのみでキャッシュするため、
          # あるリクエストへの応答（例: /_callback?code=A&state=Xへのリダイレクト、または
          # 一時的なエラー）が同じパスへの別のリクエストにもそのまま返り得る
          # （examination#143、ログイン後に「invalid state」から復旧しなくなる不具合の
          # 原因）。CachingDisabled（AWSマネージドポリシー、全アカウント共通の固定ID）を
          # 個別のCacheBehaviorとして割り当て、これらのパスをキャッシュ対象から除外する
          CacheBehaviors:
            - PathPattern: "_callback"
              TargetOriginId: s3origin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            - PathPattern: "_logout"
              TargetOriginId: s3origin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            - PathPattern: "_admin/emails"
              TargetOriginId: s3origin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            - PathPattern: "_link-line"
              TargetOriginId: s3origin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            - PathPattern: "_voice-token"
              TargetOriginId: s3origin
              ViewerProtocolPolicy: redirect-to-https
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 404
              ResponsePagePath: /404.html
            - ErrorCode: 404
              ResponseCode: 404
              ResponsePagePath: /404.html

    SiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref SiteBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  Outputs:
    BucketName:
      Value: !Ref SiteBucket
    DistributionId:
      Value: !Ref SiteDistribution
    DistributionDomainName:
      Value: !GetAtt SiteDistribution.DomainName
