service: examination-bot

frameworkVersion: "3"

provider:
  name: aws
  # 元はap-northeast-1だったが、site-stack（Lambda@Edgeの制約でus-east-1固定）が
  # 所有するテーブルへのアクセスが常にクロスリージョンになっていたため統一した
  # （examination#63）。bot-stack側にはリージョン制約が無いため自由に選べる
  region: us-east-1
  stage: prod
  runtime: nodejs20.x
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt InterviewQuestionsTable.Arn
            - !GetAtt BotSessionsTable.Arn
            - !GetAtt LineLinksTable.Arn
        # site-stackが所有するテーブルへのクロススタックアクセス（examination#49）。
        # 別Serverless serviceのため、CloudFormationのFn::ImportValueではなくARNを直接組み立てる。
        # us-east-1に統一済みのため、Resourceのリージョン部分はAWS::Regionでよい
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/examination-line-link-codes"
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/examination-allowed-emails"

functions:
  lineWebhook:
    handler: functions/lineWebhook.handler
    memorySize: 256
    # HTTP APIのタイムアウトは30秒固定のため、Lambda側はそれより短くして
    # ゲートウェイタイムアウト（クライアントには失敗と見えるがLambdaは処理継続する状態）を避ける
    timeout: 25
    # 当初はLambda Function URLで公開していたが、このAWSアカウントではFunction URLの
    # 匿名アクセス(AuthType: NONE)がAWS側で403 Forbidden(AccessDeniedException)を返す
    # 状態にあり、設定は正しいにもかかわらず解消しなかった（examination#52）。
    # 同一アカウントでAPI Gateway経由の公開エンドポイントは正常動作する実績があるため、
    # HTTP API（payload format 2.0。Function URLと同一のevent形式でハンドラー側の変更は不要）
    # 経由に切り替える。認証は引き続きLINEの署名検証(X-Line-Signature)で行う
    events:
      - httpApi:
          path: /webhook
          method: POST

resources:
  Resources:
    # 面接想定問答（ユーザー登録データ）。familySlugは複数家族対応(examination#44)を
    # 見据えたキー設計だが、v1では常に"chofu-suzuki"固定で扱う
    InterviewQuestionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-interview-questions
        AttributeDefinitions:
          - AttributeName: familySlug
            AttributeType: S
          - AttributeName: questionId
            AttributeType: S
        KeySchema:
          - AttributeName: familySlug
            KeyType: HASH
          - AttributeName: questionId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    # LINEユーザーごとの会話状態（面接練習中/登録確認待ち等）。放置されたセッションを
    # 自動的に片付けるためTTLを設定する
    BotSessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-bot-sessions
        AttributeDefinitions:
          - AttributeName: lineUserId
            AttributeType: S
        KeySchema:
          - AttributeName: lineUserId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # LINEアカウント(lineUserId)とGoogleアカウント(email)の永続的な紐付け（examination#49）。
    # サイト側で発行したワンタイムコードの検証に成功した時点で書き込む
    LineLinksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-line-links
        AttributeDefinitions:
          - AttributeName: lineUserId
            AttributeType: S
        KeySchema:
          - AttributeName: lineUserId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
