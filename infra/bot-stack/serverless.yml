service: examination-bot

frameworkVersion: "3"

provider:
  name: aws
  # 元はap-northeast-1だったが、site-stack（Lambda@Edgeの制約でus-east-1固定）が
  # 所有するテーブルへのアクセスが常にクロスリージョンになっていたため統一した
  # （examination#63）。bot-stack側にはリージョン制約が無いため自由に選べる
  region: us-east-1
  stage: prod
  runtime: nodejs20.x
  httpApi:
    # 音声対話ページ（examination#62）はブラウザから直接このAPIをfetchするクロス
    # オリジンのHTTP APIのためCORSが必要。lineWebhookはサーバー間通信でブラウザを
    # 経由しないためCORSヘッダーの付与自体は無害（認証はBearerトークン/署名検証で行う）
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt InterviewQuestionsTable.Arn
            - !GetAtt BotSessionsTable.Arn
            - !GetAtt LineLinksTable.Arn
            - !GetAtt MockInterviewsTable.Arn
            - !GetAtt FamilyProfileTable.Arn
        # Gemini API呼び出し回数の1日あたり上限カウンタ（examination#124）。UpdateItemの
        # みで完結するため他テーブルとはActionを分けて宣言する
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt AiApiIssuanceTable.Arn
        # site-stackが所有するテーブルへのクロススタックアクセス（examination#49）。
        # 別Serverless serviceのため、CloudFormationのFn::ImportValueではなくARNを直接組み立てる。
        # us-east-1に統一済みのため、Resourceのリージョン部分はAWS::Regionでよい
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/examination-line-link-codes"
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/examination-allowed-emails"
        # 音声対話ページ用の短期トークン（site-stack所有、examination#62）
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/examination-voice-tokens"

functions:
  lineWebhook:
    handler: functions/lineWebhook.handler
    memorySize: 256
    # HTTP APIのタイムアウトは30秒固定のため、Lambda側はそれより短くして
    # ゲートウェイタイムアウト（クライアントには失敗と見えるがLambdaは処理継続する状態）を避ける
    timeout: 25
    # 当初はLambda Function URLで公開していたが、このAWSアカウントではFunction URLの
    # 匿名アクセス(AuthType: NONE)がAWS側で403 Forbidden(AccessDeniedException)を返す
    # 状態にあり、設定は正しいにもかかわらず解消しなかった（examination#52）。
    # 同一アカウントでAPI Gateway経由の公開エンドポイントは正常動作する実績があるため、
    # HTTP API（payload format 2.0。Function URLと同一のevent形式でハンドラー側の変更は不要）
    # 経由に切り替える。認証は引き続きLINEの署名検証(X-Line-Signature)で行う
    events:
      - httpApi:
          path: /webhook
          method: POST

  # 音声対話機能（examination#62）。ブラウザ（PWA）のWeb Speech APIで文字起こしした
  # テキストをGemini APIへ中継し、応答テキストを返す。音声処理自体はクライアント側で
  # 完結させ、バックエンドは常にテキストのみを扱う
  voiceChat:
    handler: functions/voiceChat.handler
    memorySize: 256
    timeout: 25
    events:
      - httpApi:
          path: /voice-chat
          method: POST

  # 想定問答の一覧取得API（examination#77）。app/interview-questions/がブラウザから
  # 直接呼ぶ読み取り専用API。voiceChatと同じ短期トークン（/_voice-token）で認証する
  interviewQuestions:
    handler: functions/interviewQuestions.handler
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /interview-questions
          method: GET

  # 模擬面接記録の一覧取得API（examination#103）。app/mock-interviews/がブラウザから
  # 直接呼ぶ読み取り専用API。interviewQuestionsと同じ短期トークンで認証する
  mockInterviewsApi:
    handler: functions/mockInterviewsApi.handler
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /mock-interviews
          method: GET

  # プロフィール（志望先の特色・その他前提情報）の取得・更新API（examination#125）。
  # app/profile-edit/がブラウザから直接呼ぶ。interviewQuestionsと同じ短期トークンで認証する
  familyProfileApi:
    handler: functions/familyProfileApi.handler
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /family-profile
          method: GET
      - httpApi:
          path: /family-profile
          method: POST

resources:
  Resources:
    # 面接想定問答（ユーザー登録データ）。familySlugは複数家族対応(examination#44)を
    # 見据えたキー設計だが、v1では常に"chofu-suzuki"固定で扱う
    InterviewQuestionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-interview-questions
        AttributeDefinitions:
          - AttributeName: familySlug
            AttributeType: S
          - AttributeName: questionId
            AttributeType: S
        KeySchema:
          - AttributeName: familySlug
            KeyType: HASH
          - AttributeName: questionId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    # LINEユーザーごとの会話状態（面接練習中/登録確認待ち等）。放置されたセッションを
    # 自動的に片付けるためTTLを設定する
    BotSessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-bot-sessions
        AttributeDefinitions:
          - AttributeName: lineUserId
            AttributeType: S
        KeySchema:
          - AttributeName: lineUserId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # LINEアカウント(lineUserId)とGoogleアカウント(email)の永続的な紐付け（examination#49）。
    # サイト側で発行したワンタイムコードの検証に成功した時点で書き込む
    LineLinksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-line-links
        AttributeDefinitions:
          - AttributeName: lineUserId
            AttributeType: S
        KeySchema:
          - AttributeName: lineUserId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # 模擬面接記録（examination#93）。練習セッション終了時にAIが会話を振り返って
    # 生成するサマリーを保存する。familySlugは他テーブルと同じキー設計（複数家族対応
    # examination#44を見据える）
    MockInterviewsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-mock-interviews
        AttributeDefinitions:
          - AttributeName: familySlug
            AttributeType: S
          - AttributeName: sessionId
            AttributeType: S
        KeySchema:
          - AttributeName: familySlug
            KeyType: HASH
          - AttributeName: sessionId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    # プロフィール（志望先の特色・その他前提情報）。家族単位で1件のみ保持する
    # （examination#125）。以前は面接練習のたびに毎回自由入力していたが、
    # プロフィール編集画面で編集・保存し、面接練習側は参照するのみにする
    FamilyProfileTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-family-profile
        AttributeDefinitions:
          - AttributeName: familySlug
            AttributeType: S
        KeySchema:
          - AttributeName: familySlug
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Gemini API呼び出し回数の1日あたり上限カウンタ（examination#124）。/_voice-token
    # 発行回数の上限（examination#69、site-stack）とは別に、実際のAI呼び出し回数
    # そのものをアカウント（email）単位で制限する。パーティションキーは
    # "email#YYYY-MM-DD"の複合文字列とし、UpdateItem(ADD + ConditionExpression)で
    # アトミックにインクリメント・上限判定する。TTLで日付が変わった古いカウンタを
    # 自動失効させる
    AiApiIssuanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: examination-ai-api-issuance
        AttributeDefinitions:
          - AttributeName: emailDate
            AttributeType: S
        KeySchema:
          - AttributeName: emailDate
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
