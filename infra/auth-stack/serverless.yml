service: examination-auth

frameworkVersion: "3"

provider:
  name: aws
  region: ${param:region, 'ap-northeast-1'}
  stage: prod

resources:
  Resources:
    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: examination-family-knowledge
        AutoVerifiedAttributes:
          - email

    UserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        Domain: ${param:cognitoDomainPrefix, 'bamiyanapp-examination'}
        UserPoolId: !Ref UserPool

    # Cognitoの前段でGoogleアカウントによるログインのみを許可する（パスワード認証は提供しない）
    GoogleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Properties:
        UserPoolId: !Ref UserPool
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: ${env:GOOGLE_OAUTH_CLIENT_ID}
          client_secret: ${env:GOOGLE_OAUTH_CLIENT_SECRET}
          authorize_scopes: "openid email profile"
        # name・pictureはexamination#150（画面上のユーザー名・アイコン表示）で追加。
        # 属性マッピングは毎回のGoogleログイン時に適用されるため、追加前に登録済みの
        # 既存ユーザーも次回ログイン時にCognito側の属性が更新される
        AttributeMapping:
          email: email
          username: sub
          name: name
          picture: picture

    # CloudFrontドメインは作成後不変のため、初回ブートストラップ時のみプレースホルダーを使い、
    # 実際のドメイン判明後にCallbackURLs/LogoutURLsを更新するため2回deployする
    # （.github/workflows/cd.yml参照）
    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: GoogleIdentityProvider
      Properties:
        UserPoolId: !Ref UserPool
        GenerateSecret: true
        SupportedIdentityProviders:
          - Google
        AllowedOAuthFlows:
          - code
        AllowedOAuthScopes:
          - openid
          - email
          - profile
        AllowedOAuthFlowsUserPoolClient: true
        CallbackURLs:
          - https://${param:cloudFrontDomain, 'TBD.cloudfront.net'}/_callback
        LogoutURLs:
          # checkAuth.jsの/_logoutは、CognitoのHosted UIログアウトがGoogleセッションまでは
          # 終了させないため（examination#271）、トップページへ直接ではなくGoogleセッションも
          # 終了させる中継ページ（/_logout-complete）へ遷移させる
          - https://${param:cloudFrontDomain, 'TBD.cloudfront.net'}/_logout-complete
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        # ReadAttributesを明示しないとAWSの既定値に依存し、name・pictureが
        # id_tokenのクレームに含まれる保証が無い（examination#150で画面上に
        # アイコンが表示されない不具合の原因の1つ）。AttributeMappingで
        # マッピングしている属性は全てここにも明示する
        ReadAttributes:
          - email
          - name
          - picture

  Outputs:
    UserPoolId:
      Value: !Ref UserPool
    UserPoolClientId:
      Value: !Ref UserPoolClient
    UserPoolClientSecret:
      Value: !GetAtt UserPoolClient.ClientSecret
    CognitoDomain:
      # !Ref UserPoolDomainの戻り値の仕様に依存せず、実際に指定したドメインprefixから
      # 直接組み立てる（serverless.ymlの${param:...}はCFNテンプレート合成時に文字列展開される）
      Value: "https://${param:cognitoDomainPrefix, 'bamiyanapp-examination'}.auth.${param:region, 'ap-northeast-1'}.amazoncognito.com"
