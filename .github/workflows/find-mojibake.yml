name: Find mojibake in DynamoDB text data

# 想定問答（examination-interview-questions）・模擬面接記録（examination-mock-interviews）の
# 文字列フィールドに文字化け（U+FFFD置換文字）が無いかスキャンする診断用ワークフロー
# （examination#182）。geminiConversation.js postJson・checkAuth.js postFormの
# HTTPSレスポンスがチャンクごとにtoString()されていた不具合（修正済み）により、
# マルチバイト文字がチャンク境界で分割されて文字化けしたデータが残っている可能性が
# あるため、既存データの調査に使う。手動実行のみで、通常のデプロイフローには影響しない
on:
  workflow_dispatch: {}

jobs:
  find-mojibake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: infra/bot-stack/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # bot-stackはus-east-1に統一済み（examination#63）
          aws-region: us-east-1

      - name: Install dependencies
        working-directory: infra/bot-stack
        run: npm ci

      - name: Scan for mojibake
        working-directory: infra/bot-stack
        run: |
          {
            echo "### 文字化け（U+FFFD）スキャン結果"
            echo '```'
            node scripts/find-mojibake.js
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
