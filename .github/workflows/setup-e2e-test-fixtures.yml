name: Setup E2E test fixtures

# Playwright E2Eテスト（examination#404）用の固定データを用意するワンショットワークフロー
# （examination#413）。実Googleアカウントを新規作成せず、Cognito User Pool内に
# ネイティブ（Google非連携）のテスト専用ユーザーを1つ作成し、examination-families・
# examination-allowed-emailsへ対応するテスト専用家族レコードを投入する。
# いずれも既に存在する場合は何もしない冪等な処理のため、再実行しても安全
# （docs/sandboxed-agent-production-data-pattern.mdと同じ「実行ロジックはコード化し
# GitHub Actions側に委ねる」方式）。
#
# 前提: 実行前にGitHub Secrets（Settings > Secrets and variables > Actions）へ
# E2E_TEST_USER_PASSWORDを登録しておくこと（Cognitoのパスワードポリシー既定値を
# 満たす8文字以上・大小英字/数字/記号混在の値）。
on:
  workflow_dispatch: {}

env:
  # example.comはRFC 2606でドキュメント・テスト用に予約されたドメインのため、
  # 実在のメールボックスと衝突しない安全な識別子として使う
  E2E_TEST_USER_EMAIL: e2e-test@example.com
  E2E_TEST_FAMILY_SLUG: e2e-test
  E2E_TEST_FAMILY_NAME: E2Eテスト家族

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Get auth-stack UserPoolId
        id: auth-outputs
        run: |
          OUT=$(aws cloudformation describe-stacks --region ap-northeast-1 --stack-name examination-auth-prod --query "Stacks[0].Outputs")
          echo "user_pool_id=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Create native Cognito test user (if not already present)
        id: create-user
        env:
          USER_POOL_ID: ${{ steps.auth-outputs.outputs.user_pool_id }}
        run: |
          if aws cognito-idp admin-get-user --region ap-northeast-1 \
              --user-pool-id "$USER_POOL_ID" --username "$E2E_TEST_USER_EMAIL" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Cognito test user already exists, skipping creation"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            aws cognito-idp admin-create-user --region ap-northeast-1 \
              --user-pool-id "$USER_POOL_ID" \
              --username "$E2E_TEST_USER_EMAIL" \
              --user-attributes Name=email,Value="$E2E_TEST_USER_EMAIL" Name=email_verified,Value=true Name=name,Value="E2E Test" \
              --message-action SUPPRESS
            echo "Created Cognito test user $E2E_TEST_USER_EMAIL"
          fi

      # admin-create-userはUserStatusをFORCE_CHANGE_PASSWORDにするだけでログイン可能な
      # パスワードを設定しないため、ユーザー作成の有無に関わらず（既存ユーザーの
      # パスワードローテーション用途も兼ね）毎回実行する（examination#413、
      # E2E_TEST_USER_PASSWORD未登録のままadmin-create-userだけ成功しadmin-set-user-password
      # が失敗した場合、作成判定をスキップする既存ユーザーへパスワードを設定し直せなくなる
      # 不具合が実際に本番で発生したため分離した）
      - name: Set native Cognito test user password
        env:
          USER_POOL_ID: ${{ steps.auth-outputs.outputs.user_pool_id }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          aws cognito-idp admin-set-user-password --region ap-northeast-1 \
            --user-pool-id "$USER_POOL_ID" \
            --username "$E2E_TEST_USER_EMAIL" \
            --password "$E2E_TEST_USER_PASSWORD" \
            --permanent
          echo "Set password for Cognito test user $E2E_TEST_USER_EMAIL"

      # UserPoolClientはGenerateSecret: trueのため、Admin*Auth系APIの呼び出しには
      # SECRET_HASH（HMAC-SHA256(username + client_id, client_secret)のBase64）が必要
      - name: Get auth-stack client credentials
        id: client-creds
        run: |
          OUT=$(aws cloudformation describe-stacks --region ap-northeast-1 --stack-name examination-auth-prod --query "Stacks[0].Outputs")
          CLIENT_ID=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')
          CLIENT_SECRET=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientSecret") | .OutputValue')
          echo "::add-mask::$CLIENT_SECRET"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "client_secret=$CLIENT_SECRET" >> "$GITHUB_OUTPUT"

      - name: Compute SECRET_HASH
        id: secret-hash
        env:
          CLIENT_ID: ${{ steps.client-creds.outputs.client_id }}
          CLIENT_SECRET: ${{ steps.client-creds.outputs.client_secret }}
        run: |
          HASH=$(node -e '
            const crypto = require("crypto");
            const message = process.env.E2E_TEST_USER_EMAIL + process.env.CLIENT_ID;
            const hmac = crypto.createHmac("sha256", process.env.CLIENT_SECRET);
            hmac.update(message);
            process.stdout.write(hmac.digest("base64"));
          ')
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # examination#413の完了条件・tasks/plan.mdのRisks and Mitigationsで約束した
      # 実機検証。ALLOW_ADMIN_USER_PASSWORD_AUTHがAdminInitiateAuth経由では
      # 実際にトークンを発行できることを確認する
      - name: Verify AdminInitiateAuth issues a token
        env:
          USER_POOL_ID: ${{ steps.auth-outputs.outputs.user_pool_id }}
          CLIENT_ID: ${{ steps.client-creds.outputs.client_id }}
          SECRET_HASH: ${{ steps.secret-hash.outputs.hash }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          TOKEN_TYPE=$(aws cognito-idp admin-initiate-auth --region ap-northeast-1 \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$CLIENT_ID" \
            --auth-flow ADMIN_USER_PASSWORD_AUTH \
            --auth-parameters USERNAME="$E2E_TEST_USER_EMAIL",PASSWORD="$E2E_TEST_USER_PASSWORD",SECRET_HASH="$SECRET_HASH" \
            --query "AuthenticationResult.TokenType" --output text)
          echo "AdminInitiateAuth succeeded, TokenType=$TOKEN_TYPE"

      # 公開エンドポイントInitiateAuthはIAM認証を必要としないため、ADMIN_USER_PASSWORD_AUTHが
      # 誤ってここからも使えてしまうと「Googleアカウントによるログインのみを許可する」という
      # 一般公開のログイン経路の性質が崩れる重大な問題になる。実際に拒否されることを確認する
      - name: Verify public InitiateAuth rejects ADMIN_USER_PASSWORD_AUTH
        env:
          CLIENT_ID: ${{ steps.client-creds.outputs.client_id }}
          SECRET_HASH: ${{ steps.secret-hash.outputs.hash }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          if aws cognito-idp initiate-auth --region ap-northeast-1 \
              --client-id "$CLIENT_ID" \
              --auth-flow ADMIN_USER_PASSWORD_AUTH \
              --auth-parameters USERNAME="$E2E_TEST_USER_EMAIL",PASSWORD="$E2E_TEST_USER_PASSWORD",SECRET_HASH="$SECRET_HASH" \
              >/tmp/initiate-auth-out.json 2>/tmp/initiate-auth-err.txt; then
            echo "::error::公開InitiateAuthがADMIN_USER_PASSWORD_AUTHを受理してしまいました。重大なセキュリティ上の問題です。直ちにauth-stackのExplicitAuthFlowsからALLOW_ADMIN_USER_PASSWORD_AUTHを削除してください。"
            cat /tmp/initiate-auth-out.json
            exit 1
          else
            echo "公開InitiateAuthはADMIN_USER_PASSWORD_AUTHを想定通り拒否しました:"
            cat /tmp/initiate-auth-err.txt
          fi

      - name: Seed E2E test family (if not already present)
        id: seed-family
        run: |
          if aws dynamodb get-item --region us-east-1 --table-name examination-families \
              --key "{\"slug\": {\"S\": \"$E2E_TEST_FAMILY_SLUG\"}}" --query "Item" --output text | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "examination-families already has $E2E_TEST_FAMILY_SLUG, skipping seed"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            aws dynamodb put-item --region us-east-1 --table-name examination-families \
              --item "{\"slug\": {\"S\": \"$E2E_TEST_FAMILY_SLUG\"}, \"name\": {\"S\": \"$E2E_TEST_FAMILY_NAME\"}, \"createdBy\": {\"S\": \"e2e-setup\"}, \"createdAt\": {\"S\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
            echo "Seeded examination-families: $E2E_TEST_FAMILY_SLUG"
          fi

      - name: Seed E2E test allowed email (if not already present)
        id: seed-allowed-email
        run: |
          if aws dynamodb get-item --region us-east-1 --table-name examination-allowed-emails \
              --key "{\"email\": {\"S\": \"$E2E_TEST_USER_EMAIL\"}}" --query "Item" --output text | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "examination-allowed-emails already has $E2E_TEST_USER_EMAIL, skipping seed"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            aws dynamodb put-item --region us-east-1 --table-name examination-allowed-emails \
              --item "{\"email\": {\"S\": \"$E2E_TEST_USER_EMAIL\"}, \"addedBy\": {\"S\": \"e2e-setup\"}, \"addedAt\": {\"S\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}, \"familySlug\": {\"S\": \"$E2E_TEST_FAMILY_SLUG\"}}"
            echo "Seeded examination-allowed-emails: $E2E_TEST_USER_EMAIL"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### E2Eテスト用フィクスチャ セットアップ結果"
            echo "- Cognitoテストユーザー（$E2E_TEST_USER_EMAIL）: 新規作成=${{ steps.create-user.outputs.created }}"
            echo "- テスト家族（$E2E_TEST_FAMILY_SLUG）: 新規作成=${{ steps.seed-family.outputs.created }}"
            echo "- 許可メールアドレス: 新規作成=${{ steps.seed-allowed-email.outputs.created }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
