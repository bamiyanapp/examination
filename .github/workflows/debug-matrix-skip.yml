name: Debug Matrix Skip

on:
  push:
    branches:
      - debug/matrix-skip-diagnosis

jobs:
  matrix-job:
    strategy:
      matrix:
        item: ${{ fromJSON('[]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo hi

  check:
    needs: matrix-job
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "result=[${{ needs.matrix-job.result }}]"
          echo "empty-array-first-elem-is-null=${{ fromJSON('[]')[0] == null }}"
          echo "nonempty-array-first-elem-is-null=${{ fromJSON('[{"a":1}]')[0] == null }}"
          echo "packages-empty-string-check=${{ '' == '' }}"
