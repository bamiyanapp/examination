name: Debug Matrix Skip

on:
  push:
    branches:
      - debug/matrix-skip-diagnosis

jobs:
  matrix-job:
    strategy:
      matrix:
        item: ${{ fromJSON('[]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo hi

  check:
    needs: matrix-job
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "result=[${{ needs.matrix-job.result }}]"
          echo "equals-skipped=${{ needs.matrix-job.result == 'skipped' }}"
          echo "equals-success=${{ needs.matrix-job.result == 'success' }}"
          echo "contains-failure-cancelled=${{ contains(fromJSON('[\"failure\",\"cancelled\"]'), needs.matrix-job.result) }}"
