name: Diagnose E2E failures (one-off)

# examination#559の調査専用の一時workflow。sandbox-unreachable-investigation
# Skillに従い、playwright-reportアーティファクト（サンドボックスのエグレス
# プロキシがダウンロード先のAzure Blob Storageへの接続を拒否するため直接
# 確認できない）をGitHub Actions側で展開し、失敗テストのエラー詳細を
# Job Summary・ログの両方へ出力する。調査完了後に削除する
on:
  workflow_dispatch:
    inputs:
      family_create_run_id:
        description: "e2e-family-createが失敗したworkflow run ID"
        type: string
        required: true
      interview_questions_run_id:
        description: "e2e-interview-questionsが失敗したworkflow run ID"
        type: string
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download family-create playwright-report
        run: |
          gh run download "${{ inputs.family_create_run_id }}" \
            --repo "${{ github.repository }}" \
            --name playwright-report \
            --dir ./report-family-create
      - name: Download interview-questions playwright-report
        run: |
          gh run download "${{ inputs.interview_questions_run_id }}" \
            --repo "${{ github.repository }}" \
            --name playwright-report \
            --dir ./report-interview-questions
      - name: Show artifact file tree
        run: |
          {
            echo "### family-create アーティファクトのファイル一覧"
            echo '```'
            find ./report-family-create -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2
            echo '```'
            echo ""
            echo "### interview-questions アーティファクトのファイル一覧"
            echo '```'
            find ./report-interview-questions -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Extract and summarize errors
        # バンドルされたtrace-viewer等の巨大なJS/wasmファイルはサンプル文字列を
        # 含み誤検知するため、小さいテキスト系ファイル（*.md/*.json/*.txt/*.log）
        # のみを対象にする
        run: |
          {
            echo "### family-create エラー詳細"
            echo '```'
            find ./report-family-create -type f -size -200k \( -iname "*.md" -o -iname "*.json" -o -iname "*.txt" -o -iname "*.log" \) -print 2>/dev/null \
              | while read -r f; do echo "--- $f ---"; cat "$f"; echo; done
            echo '```'
            echo ""
            echo "### interview-questions エラー詳細"
            echo '```'
            find ./report-interview-questions -type f -size -200k \( -iname "*.md" -o -iname "*.json" -o -iname "*.txt" -o -iname "*.log" \) -print 2>/dev/null \
              | while read -r f; do echo "--- $f ---"; cat "$f"; echo; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
