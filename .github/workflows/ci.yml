name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.7.5
    with:
      # 音声対話・管理画面等のインタラクティブなページはapp/配下のページごとに
      # 独立したReact（Vite）アプリへ段階移行中（examination#78）。それ以外は
      # 静的コンテンツ（Markdown）のみのままのため、matrix構成でapp/配下の
      # 各アプリのみlint/test/buildを実行する。
      # node_versionを明示しないとinputs.node_version（既定"20"）が使われるが、
      # 各アプリの依存（jsdom@30等）がNode.js 22以上を要求しており、Node.js 20では
      # `webidl.util.markAsUncloneable is not a function`で失敗するため24を指定する
      packages: >-
        [{"dir":"app/line-link","build":true,"node_version":"24"},
        {"dir":"app/allowed-emails","build":true,"node_version":"24"},
        {"dir":"app/voice-practice","build":true,"node_version":"24"},
        {"dir":"app/top","build":true,"node_version":"24"},
        {"dir":"app/interview-questions","build":true,"node_version":"24"},
        {"dir":"app/education-overview","build":true,"node_version":"24"},
        {"dir":"app/mock-interviews","build":true,"node_version":"24"},
        {"dir":"app/profile-edit","build":true,"node_version":"24"},
        {"dir":"app/family-create","build":true,"node_version":"24"}]
      enable_standards_check: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
