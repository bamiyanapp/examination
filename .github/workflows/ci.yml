name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.121.0
    with:
      # self_ref: 上記usesのrefと同じ値を渡す必須入力（dev-standards#1071、PR #1124）
      self_ref: v2.114.1
      # 音声対話・管理画面等のインタラクティブなページはapp/配下のページごとに
      # 独立したReact（Vite）アプリへ段階移行中（examination#78）。それ以外は
      # 静的コンテンツ（Markdown）のみのままのため、matrix構成でapp/配下の
      # 各アプリのみlint/test/buildを実行する。
      # node_versionを明示しないとinputs.node_version（既定"20"）が使われるが、
      # 各アプリの依存（jsdom@30等）がNode.js 22以上を要求しており、Node.js 20では
      # `webidl.util.markAsUncloneable is not a function`で失敗するため24を指定する
      #
      # infra/bot-stack・infra/site-stackはbuildスクリプトを持たない
      # （デプロイはServerless Frameworkが直接ソースを参照するためビルド成果物が不要）ため
      # build:trueを付けない。coverage_thresholdはexamination#401・#402でテストを整備した
      # 際の実測値（bot-stack: Stmts61.48/Branches63.48/Funcs54.87/Lines61.27%、
      # site-stack: Stmts93.16/Branches78.04/Funcs95.91/Lines94.51%）を基準に、
      # 各パッケージの実測最小値（bot-stackはFunctions、site-stackはBranches）を
      # 下回らない範囲でマージンを持たせたラチェット方式のしきい値とする
      # （duplication_thresholdと同様の方針）。bot-stackはgeminiConversation.js・
      # lineWebhook.jsの外部API呼び出し成功パス（Gemini・LINE）がテスト対象外
      # （examination#401で意図的にスコープ外とした）のため他パッケージより低め
      #
      # app/配下9アプリのcoverage_thresholdはexamination#408で導入。従来
      # `test`スクリプトが`vitest run`のみでcoverageを一切生成していなかった
      # ため（infra/bot-stack・site-stackと同じ理由）、各アプリへ
      # `@vitest/coverage-v8`を追加し`--coverage`系オプションを付与した上で
      # 実測した値（Stmts88.04〜100/Branches80.89〜91.56/Funcs77.92〜100/
      # Lines90.9〜100、アプリごとに幅がある）を基準に、各アプリの実測最小値を
      # 下回らない範囲でマージンを持たせたラチェット方式のしきい値を個別に設定する
      packages: >-
        [{"dir":"app/line-link","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/allowed-emails","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/voice-practice","build":true,"node_version":"24","coverage_threshold":78},
        {"dir":"app/top","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/interview-questions","build":true,"node_version":"24","coverage_threshold":75},
        {"dir":"app/education-overview","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/mock-interviews","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/profile-edit","build":true,"node_version":"24","coverage_threshold":80},
        {"dir":"app/family-create","build":true,"node_version":"24","coverage_threshold":80},
        {"dir":"infra/bot-stack","coverage_threshold":50},
        {"dir":"infra/site-stack","coverage_threshold":75}]
      enable_standards_check: true
      # コード重複検知（jscpd、examination#400）。duplication-checkジョブの
      # checkoutはsubmodules:trueを指定しない（reusable-ci.yml側の既定）ため
      # dev-standards submoduleは未初期化のまま計測される。ローカルで最初に
      # 計測した際はsubmodule実体（シンボリックリンク経由でdailyRateLimit.js
      # 等が実ファイルとして解決される）を含めてしまい15.91%と誤って計測して
      # いた（このジョブと同じ条件のクリーンな checkout で再計測すると20.44%）。
      # 実測値20.44%を基準としたラチェット方式のしきい値（21%、karuta#806・#833・
      # #877と同様の方針）を長期間運用していたが、examination#447でこの緩さが
      # UserMenu.tsx等の重複蓄積（tsx単体で37.42%）を検知できていなかったことが
      # 判明。dev-standards側の開発共通標準（dev-standards#416、目標値5%以下）に
      # 合わせ、app-shared/（UserMenu.tsx・AppShell.tsxのsymlink共有）・
      # infra/infra-shared/（bot-stack・site-stack共通のESLint flat config基盤）
      # 等への切り出しで実際に重複を削減した上で、実測値（クリーンなcheckoutと
      # 同条件で4.77%）を基準に5%へ引き下げた
      enable_duplication_check: true
      duplication_threshold: 5
      # 誤ってコミットされた秘密情報（APIキー・トークン等）をPR差分から検知する
      # （examination#601、dev-standards#892）。CodeQL（SAST、脆弱性パターン検知）
      # とは別物のため個別に有効化する。pull_requestイベント時のみbase_branchとの
      # 差分をスキャンする（gitleaks/gitleaks-action）
      enable_secret_scan: true
      # 依存更新PR（Renovate等）へ適用リスク・維持リスク判定（Risk Summary）・
      # SBOM（CycloneDX）を投稿する（examination#602）。gating・auto_closeは
      # 本Issueのスコープ外（別途要否を判断する）
      enable_dependency_risk_summary: true
      # docs/・CLAUDE.md・.claude/skills/配下のMarkdown文章をtextlintで
      # チェックする（examination#477・#615）。dev-standards共有設定をそのまま使えると
      # 判断済み（examination#477）。固有名詞「小学校受験対策」のmax-kanji-continuous-len
      # 誤検知のみexamination独自のtextlint.config.cjs（dev-standards側をrequireして
      # ルールを上書き）で例外許容する
      enable_text_lint: true
      text_lint_paths: "docs/*.md\nREADME.md\nCLAUDE.md\n.claude/skills/**/*.md"
      # examination#414（examination#404の子Issue）。frontend-e2e-testジョブは
      # matrix非対応でfrontend_dir単一値のみのため、まずapp/topの1つで
      # パイプライン全体（認証→保護ページ表示→スクリーンショット→Job Summary/
      # PRコメント）を実証する。node_versionはpackages内の各要素とは独立した
      # トップレベル入力で、frontend-e2e-testジョブはこちらを参照するため
      # 上記packagesの各要素と同じ24を明示する
      enable_e2e_test: true
      frontend_dir: app/top
      node_version: "24"
      # examination#465（80%目標のラチェット引き上げ）。ユーザーメニュー（共有
      # モーダルの開閉）・セクションリンク遷移のテストケースをPR #631で追加し、
      # branchesの実測値が55.68%まで上昇した（push-to-main run #42130000729）。
      # 過去のばらつき幅（約14ポイント）を踏まえたマージンを取り20→40へ引き上げる
      e2e_coverage_threshold: 40
      # ci・e2e-*の6job全てがreusable-ci.ymlを独立して呼び出す構成（1 job per
      # appパターン）のため、各呼び出し自身のmerge jobでは他の呼び出しの成否を
      # 待てず、いずれかが失敗・実行中でもPRがマージされてしまう
      # （dev-standards#421）。全呼び出しでenable_auto_merge: falseとし、
      # 全ての完了を待つ専用のgate job（末尾のmergeジョブ）でマージする
      enable_auto_merge: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      # E2E_BASE_URL（examination-site-prodのCloudFrontドメイン、作成後不変）と
      # E2E_REFRESH_TOKEN（examination#413のネイティブCognitoテストユーザーに対し
      # 事前に1回AdminInitiateAuthで取得した値、有効期限に応じて手動で再取得・
      # 更新する）を含むJSON文字列を静的なGitHub Secretとして直接参照する。
      # CIジョブ内でAWS認証情報を用いてAdminInitiateAuthをその場で呼び出し
      # job outputとして下流ジョブへ渡す方式も検討したが、GitHub Actionsは
      # ジョブがマスク対象の値（AWS認証情報等のsecrets、::add-mask::した値）に
      # 一度でも触れるとそのジョブのoutputsをジョブ単位で無条件に空文字へ
      # 差し替える仕様があり（##[warning]Skip output '...' since it may
      # contain secret.）、値の内容に関わらず後続ジョブに渡せなかったため
      # この静的secret方式に変更した
      E2E_SECRETS_JSON: ${{ secrets.E2E_SECRETS_JSON }}

  # examination#415（examination#404の子Issue）。frontend-e2e-testジョブはmatrix
  # 非対応でfrontend_dir単一値のみのため、対象アプリ1つにつき1つの追加jobを
  # 個別に呼び出す（packages・enable_duplication_checkは指定せず、上記ciジョブとは
  # 完全に独立させる。examination#404「Playwright E2E導入 詳細計画」で確定した方式）
  e2e-voice-practice:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.121.0
    with:
      # self_ref: 上記usesのrefと同じ値を渡す必須入力（dev-standards#1071、PR #1124）
      self_ref: v2.114.1
      enable_e2e_test: true
      frontend_dir: app/voice-practice
      node_version: "24"
      # examination#465。ロール切り替えテストケースをPR #628で追加したが、
      # branchesの実測値は53.61%（push-to-main run #42051653285）で、既存の
      # 閾値（40）からのマージンが過去の変動幅（約14ポイント）に対して十分では
      # ないため、このjobは今回引き上げを見送る。新たな会話分岐・エラーケースの
      # テスト追加で実測値がさらに上がった時点で再度ラチェットする
      e2e_coverage_threshold: 40
      # packagesを省略するとreusable-ci.ymlのfrontend-test/backend-testジョブ
      # （examinationが使わない固定ディレクトリ構成向けのレガシージョブ、CLAUDE.md
      # 「backend_dir: backend」既定値で発火しbackend/が存在せず失敗、frontend-test側も
      # submodules: falseでチェックアウトされdev-standards symlinkが解決できず失敗）が
      # 有効化されてしまう。packages: '[]'（空配列）を明示的に渡すことで
      # frontend-test/backend-test/package-testの3つとも無効化する
      # （reusable-ci.ymlのpackage-testジョブのコメント#151参照）
      packages: "[]"
      # frontend-e2e-testジョブのcheckoutはsubmodules: ${{ inputs.enable_standards_check }}
      # という設計（reusable-ci.yml）のため、falseのままだとdev-standardsサブモジュールが
      # チェックアウトされず、app-shared/ui/AppShell.tsx等が参照するdev-standards/shared/ui/
      # 配下実ファイルへのsymlinkが解決できずビルド失敗する（examination#415、PR #454
      # マージ後のmain push・PR #456・#457で実際に発生）。trueにするとstandards-checkジョブ
      # （リポジトリ全体のsymlink/.gitignore drift検査）が上記ciジョブと重複実行される
      # 副作用があるが、正しいビルドを優先する。恒久対応（submodulesチェックアウトの可否を
      # enable_standards_checkから分離する設計変更）はdev-standards側でのIssue化を検討する
      enable_standards_check: true
      # dev-standards#421。詳細は上記ciジョブのコメント参照
      enable_auto_merge: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      E2E_SECRETS_JSON: ${{ secrets.E2E_SECRETS_JSON }}

  # examination#416（examination#404の子Issue）。e2e-voice-practiceジョブと同じ設計・
  # 同じ理由でpackages/enable_standards_checkを設定する（詳細は上記e2e-voice-practiceの
  # コメント参照）
  e2e-interview-questions:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.121.0
    with:
      # self_ref: 上記usesのrefと同じ値を渡す必須入力（dev-standards#1071、PR #1124）
      self_ref: v2.114.1
      enable_e2e_test: true
      frontend_dir: app/interview-questions
      node_version: "24"
      # examination#465。質問追加フォームの開閉・バリデーション分岐テストをPR
      # #628で追加し、branchesの実測値が43.86%まで上昇した（push-to-main run
      # #42130000729）。過去のばらつき幅（約14ポイント）を踏まえたマージンを
      # 取り20→25へ引き上げる
      e2e_coverage_threshold: 25
      packages: "[]"
      enable_standards_check: true
      # dev-standards#421。詳細は上記ciジョブのコメント参照
      enable_auto_merge: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      E2E_SECRETS_JSON: ${{ secrets.E2E_SECRETS_JSON }}

  # examination#417（examination#404の子Issue）。e2e-voice-practiceジョブと同じ設計・
  # 同じ理由でpackages/enable_standards_checkを設定する（詳細は上記e2e-voice-practiceの
  # コメント参照）
  e2e-mock-interviews:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.121.0
    with:
      # self_ref: 上記usesのrefと同じ値を渡す必須入力（dev-standards#1071、PR #1124）
      self_ref: v2.114.1
      enable_e2e_test: true
      frontend_dir: app/mock-interviews
      node_version: "24"
      # examination#465。branchesの実測値は29.27%（push-to-main run
      # #42130000729）で、既存の閾値（20）からのマージンが過去の変動幅（約14
      # ポイント）に対して十分ではないため、このjobは今回引き上げを見送る。
      # mock-interviewsページは一覧表示のみでテストケースが少なく（既存1件）、
      # 分岐網羅のためのテスト追加が今後必要（空状態・エラー表示等）
      e2e_coverage_threshold: 20
      packages: "[]"
      enable_standards_check: true
      # dev-standards#421。詳細は上記ciジョブのコメント参照
      enable_auto_merge: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      E2E_SECRETS_JSON: ${{ secrets.E2E_SECRETS_JSON }}

  # examination#418（examination#404の子Issue）。e2e-voice-practiceジョブと同じ設計・
  # 同じ理由でpackages/enable_standards_checkを設定する（詳細は上記e2e-voice-practiceの
  # コメント参照）
  e2e-allowed-emails:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.121.0
    with:
      # self_ref: 上記usesのrefと同じ値を渡す必須入力（dev-standards#1071、PR #1124）
      self_ref: v2.114.1
      enable_e2e_test: true
      frontend_dir: app/allowed-emails
      node_version: "24"
      # examination#465。重複所属エラーのテストケース追加を試みたが、CI失敗の
      # 原因をログから特定できず取り下げた（PR #632参照）。現時点のbranches
      # 実測値は54.70%（push-to-main run #42130000729、既存の追加・削除テストの
      # みの状態）。過去のばらつき幅（約14ポイント）を踏まえたマージンを取り
      # 30→35へ引き上げる
      e2e_coverage_threshold: 35
      packages: "[]"
      enable_standards_check: true
      # dev-standards#421。詳細は上記ciジョブのコメント参照
      enable_auto_merge: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      E2E_SECRETS_JSON: ${{ secrets.E2E_SECRETS_JSON }}

  # examination#419（examination#404の子Issue）。e2e-voice-practiceジョブと同じ設計・
  # 同じ理由でpackages/enable_standards_checkを設定する（詳細は上記e2e-voice-practiceの
  # コメント参照）。家族の新規作成という性質上、テスト実行のたびに新規作成しても
  # 実データが増え続けないよう、infra/site-stack/functions/checkAuth.js側にテスト
  # 専用の使い捨て経路（examination#419）を用意し、共有E2Eテストユーザーの家族所属
  # 状態を変えずに検証する
  e2e-family-create:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.121.0
    with:
      # self_ref: 上記usesのrefと同じ値を渡す必須入力（dev-standards#1071、PR #1124）
      self_ref: v2.114.1
      enable_e2e_test: true
      frontend_dir: app/family-create
      node_version: "24"
      # examination#465。所属済みアカウント向けの案内表示テストケースをPR #634
      # で追加し、branchesの実測値は58.82%（push-to-main run #42130000729）。
      # 既存の閾値（40）からのマージンが過去の変動幅（約14ポイント）に対して
      # 十分ではないため、このjobは今回引き上げを見送る
      e2e_coverage_threshold: 40
      packages: "[]"
      enable_standards_check: true
      # dev-standards#421。詳細は上記ciジョブのコメント参照
      enable_auto_merge: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      E2E_SECRETS_JSON: ${{ secrets.E2E_SECRETS_JSON }}

  # stylelintはreusable-ci.ymlの機能（enable_*入力）ではないため、独立した
  # jobとして自前で用意する（examination#476）。stylelint.config.cjs
  # （dev-standards submodule配下からのsymlink）が必要なためsubmodules: true。
  # stylelint・stylelint-config-standardはルートpackage.jsonのdevDependencies
  # として追加した（npx --yesでの都度取得はextends先の解決に失敗したため、
  # dev-standards本体と同じ「実devDependencyとしてインストールする」方式に
  # した）。対象はapp/配下9アプリの実体CSS（bootstrap-theme.css・
  # common-theme.cssはdev-standards所有のsymlinkのため対象外）
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run lint:css

  # dev-standards#421。ci・e2e-*の6job全てがenable_auto_merge: falseのため、
  # 各呼び出し自身のmerge jobは実行されない。このgate jobが全6jobの完了を
  # 待ってから、reusable-ci.ymlのmerge jobと同じ判定方式
  # （skippedは許容、failure・cancelledは拒否）でPRをsquash mergeする
  # （docs/cicd-pipeline-specification.md「複数アプリ向けにreusable-ci.ymlを
  # 独立して複数回呼び出す構成」参照）
  merge:
    needs:
      [
        ci,
        e2e-voice-practice,
        e2e-interview-questions,
        e2e-mock-interviews,
        e2e-allowed-emails,
        e2e-family-create,
        stylelint,
      ]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.ci.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-voice-practice.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-interview-questions.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-mock-interviews.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-allowed-emails.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-family-create.result) &&
      !contains(fromJSON('["failure", "cancelled"]'), needs.stylelint.result)
    runs-on: ubuntu-latest
    # reusable-ci.yml自身のmerge jobと同じグループ名にすることで、万が一
    # 単一呼び出し構成のPRと混在する事態になっても直列化される
    concurrency:
      group: merge-queue-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: bamiyanapp/dev-standards/.github/actions/merge-pr@v2.121.0
        with:
          github-token: ${{ secrets.BOT_TOKEN != '' && secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
