name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # examination#414（examination#404の子Issue）: app/topのPlaywright E2Eテストが
  # AdminInitiateAuth（examination#413）でE2Eテスト専用ユーザーのid_token・
  # refresh_tokenをその場で発行するために必要な値を用意し、ciジョブへ
  # E2E_SECRETS_JSON経由で渡す。ciジョブ内のfrontend-e2e-testジョブは
  # reusable-ci.yml側の実装であり、examination側から追加のステップを挟めない
  # （dynamic-config not possible inside a called reusable workflow's job）ため、
  # 呼び出し前の別ジョブとしてここで用意する
  e2e-prep-top:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      secrets_json: ${{ steps.build-secrets.outputs.json }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Get auth-stack outputs
        id: auth-outputs
        run: |
          OUT=$(aws cloudformation describe-stacks --region ap-northeast-1 --stack-name examination-auth-prod --query "Stacks[0].Outputs")
          echo "user_pool_id=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          CLIENT_ID=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')
          CLIENT_SECRET=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientSecret") | .OutputValue')
          echo "::add-mask::$CLIENT_SECRET"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "client_secret=$CLIENT_SECRET" >> "$GITHUB_OUTPUT"

      - name: Get site CloudFront domain
        id: site-domain
        run: |
          DOMAIN=$(aws cloudformation describe-stacks --region us-east-1 --stack-name examination-site-prod \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text)
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      # examination-allowed-emailsに登録済みのE2Eテスト専用ユーザー（examination#413）で
      # AdminInitiateAuth（IAM認証済みAPI専用、公開InitiateAuthからは呼び出せないことを
      # examination#413で実機検証済み）を呼び、その場でid_token・refresh_tokenを発行する
      - name: Issue E2E test tokens via AdminInitiateAuth
        id: tokens
        env:
          USER_POOL_ID: ${{ steps.auth-outputs.outputs.user_pool_id }}
          CLIENT_ID: ${{ steps.auth-outputs.outputs.client_id }}
          CLIENT_SECRET: ${{ steps.auth-outputs.outputs.client_secret }}
          E2E_TEST_USER_EMAIL: e2e-test@example.com
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          SECRET_HASH=$(node -e '
            const crypto = require("crypto");
            const message = process.env.E2E_TEST_USER_EMAIL + process.env.CLIENT_ID;
            const hmac = crypto.createHmac("sha256", process.env.CLIENT_SECRET);
            hmac.update(message);
            process.stdout.write(hmac.digest("base64"));
          ')
          RESULT=$(aws cognito-idp admin-initiate-auth --region ap-northeast-1 \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$CLIENT_ID" \
            --auth-flow ADMIN_USER_PASSWORD_AUTH \
            --auth-parameters USERNAME="$E2E_TEST_USER_EMAIL",PASSWORD="$E2E_TEST_USER_PASSWORD",SECRET_HASH="$SECRET_HASH")
          ID_TOKEN=$(echo "$RESULT" | jq -r '.AuthenticationResult.IdToken')
          REFRESH_TOKEN=$(echo "$RESULT" | jq -r '.AuthenticationResult.RefreshToken')
          # id_token・refresh_tokenはjobのoutputとして次のciジョブ（別ジョブ）へ
          # 渡す必要があるため、あえて::add-mask::しない。GitHub Actionsは
          # ::add-mask::済みの値をjob outputへ設定しようとすると「Skip output
          # '...' since it may contain secret」で値を空にしてしまう仕様があり、
          # 実際にこれが原因でE2E_BASE_URL等が空文字列になりテストが失敗した
          # （PR #428で実機確認）。E2Eテスト専用ユーザー（examination#413）は
          # 実在の家族データを一切持たないダミーの家族にのみアクセスできるため、
          # このトークンがログ上に残ること自体のリスクは低いと判断した
          echo "id_token=$ID_TOKEN" >> "$GITHUB_OUTPUT"
          echo "refresh_token=$REFRESH_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build E2E_SECRETS_JSON
        id: build-secrets
        env:
          E2E_BASE_URL: https://${{ steps.site-domain.outputs.domain }}
          E2E_ID_TOKEN: ${{ steps.tokens.outputs.id_token }}
          E2E_REFRESH_TOKEN: ${{ steps.tokens.outputs.refresh_token }}
        run: |
          JSON=$(node -e '
            process.stdout.write(JSON.stringify({
              E2E_BASE_URL: process.env.E2E_BASE_URL,
              E2E_ID_TOKEN: process.env.E2E_ID_TOKEN,
              E2E_REFRESH_TOKEN: process.env.E2E_REFRESH_TOKEN,
            }));
          ')
          echo "json=$JSON" >> "$GITHUB_OUTPUT"

  ci:
    needs: e2e-prep-top
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.13.0
    with:
      # 音声対話・管理画面等のインタラクティブなページはapp/配下のページごとに
      # 独立したReact（Vite）アプリへ段階移行中（examination#78）。それ以外は
      # 静的コンテンツ（Markdown）のみのままのため、matrix構成でapp/配下の
      # 各アプリのみlint/test/buildを実行する。
      # node_versionを明示しないとinputs.node_version（既定"20"）が使われるが、
      # 各アプリの依存（jsdom@30等）がNode.js 22以上を要求しており、Node.js 20では
      # `webidl.util.markAsUncloneable is not a function`で失敗するため24を指定する
      #
      # infra/bot-stack・infra/site-stackはbuildスクリプトを持たない
      # （デプロイはServerless Frameworkが直接ソースを参照するためビルド成果物が不要）ため
      # build:trueを付けない。coverage_thresholdはexamination#401・#402でテストを整備した
      # 際の実測値（bot-stack: Stmts61.48/Branches63.48/Funcs54.87/Lines61.27%、
      # site-stack: Stmts93.16/Branches78.04/Funcs95.91/Lines94.51%）を基準に、
      # 各パッケージの実測最小値（bot-stackはFunctions、site-stackはBranches）を
      # 下回らない範囲でマージンを持たせたラチェット方式のしきい値とする
      # （duplication_thresholdと同様の方針）。bot-stackはgeminiConversation.js・
      # lineWebhook.jsの外部API呼び出し成功パス（Gemini・LINE）がテスト対象外
      # （examination#401で意図的にスコープ外とした）のため他パッケージより低め
      #
      # app/配下9アプリのcoverage_thresholdはexamination#408で導入。従来
      # `test`スクリプトが`vitest run`のみでcoverageを一切生成していなかった
      # ため（infra/bot-stack・site-stackと同じ理由）、各アプリへ
      # `@vitest/coverage-v8`を追加し`--coverage`系オプションを付与した上で
      # 実測した値（Stmts88.04〜100/Branches80.89〜91.56/Funcs77.92〜100/
      # Lines90.9〜100、アプリごとに幅がある）を基準に、各アプリの実測最小値を
      # 下回らない範囲でマージンを持たせたラチェット方式のしきい値を個別に設定する
      packages: >-
        [{"dir":"app/line-link","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/allowed-emails","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/voice-practice","build":true,"node_version":"24","coverage_threshold":78},
        {"dir":"app/top","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/interview-questions","build":true,"node_version":"24","coverage_threshold":75},
        {"dir":"app/education-overview","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/mock-interviews","build":true,"node_version":"24","coverage_threshold":85},
        {"dir":"app/profile-edit","build":true,"node_version":"24","coverage_threshold":80},
        {"dir":"app/family-create","build":true,"node_version":"24","coverage_threshold":80},
        {"dir":"infra/bot-stack","coverage_threshold":50},
        {"dir":"infra/site-stack","coverage_threshold":75}]
      enable_standards_check: true
      # コード重複検知（jscpd、examination#400）。duplication-checkジョブの
      # checkoutはsubmodules:trueを指定しない（reusable-ci.yml側の既定）ため
      # dev-standards submoduleは未初期化のまま計測される。ローカルで最初に
      # 計測した際はsubmodule実体（シンボリックリンク経由でdailyRateLimit.js
      # 等が実ファイルとして解決される）を含めてしまい15.91%と誤って計測して
      # いた（このジョブと同じ条件のクリーンな checkout で再計測すると20.44%）。
      # 実測値20.44%を基準に、以後の増加を検知するラチェット方式のしきい値とする
      # （karuta#806・#833・#877と同様の方針）
      enable_duplication_check: true
      duplication_threshold: 21
      # examination#414（examination#404の子Issue）。frontend-e2e-testジョブは
      # matrix非対応でfrontend_dir単一値のみのため、まずapp/topの1つで
      # パイプライン全体（認証→保護ページ表示→スクリーンショット→Job Summary/
      # PRコメント）を実証する。node_versionはpackages内の各要素とは独立した
      # トップレベル入力で、frontend-e2e-testジョブはこちらを参照するため
      # 上記packagesの各要素と同じ24を明示する
      enable_e2e_test: true
      frontend_dir: app/top
      node_version: "24"
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      E2E_SECRETS_JSON: ${{ needs.e2e-prep-top.outputs.secrets_json }}
