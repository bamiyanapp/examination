name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# 複数回のpushが短時間に重なった場合、AWSリソースへの同時デプロイで競合しないよう直列化する
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            app/line-link/package-lock.json
            app/allowed-emails/package-lock.json
            app/voice-practice/package-lock.json
            app/top/package-lock.json
            app/interview-questions/package-lock.json
            app/education-overview/package-lock.json
            app/mock-interviews/package-lock.json
            app/profile-edit/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Build MkDocs site
        run: |
          pip install -r requirements.txt
          mkdocs build --strict

      # LINE連携ページ（examination#78、React段階移行 Phase 1）。MkDocsが生成した
      # 同名パスのページを、app/line-link/でビルドしたReactアプリの静的アセットで上書きする
      - name: Build and embed the React app (LINE連携)
        working-directory: app/line-link
        run: |
          npm ci
          npm run build
          rm -rf ../../site/settings/line-link
          mkdir -p ../../site/settings/line-link
          cp -r dist/. ../../site/settings/line-link/

      # 閲覧許可メールアドレス管理ページ（examination#78、React段階移行 Phase 2）
      - name: Build and embed the React app (閲覧許可メールアドレス管理)
        working-directory: app/allowed-emails
        run: |
          npm ci
          npm run build
          rm -rf ../../site/settings/allowed-emails
          mkdir -p ../../site/settings/allowed-emails
          cp -r dist/. ../../site/settings/allowed-emails/

      # 音声で面接練習ページ（examination#78、React段階移行 Phase 3。examination#76の
      # 汎用化・チャット風UI化を反映）
      - name: Build and embed the React app (音声で面接練習)
        working-directory: app/voice-practice
        run: |
          npm ci
          npm run build
          rm -rf ../../site/education/voice-practice
          mkdir -p ../../site/education/voice-practice
          cp -r dist/. ../../site/education/voice-practice/

      # 想定問答ページ（examination#77）。本人/父/母で分かれていた3ページを1画面に統合し、
      # DynamoDB（examination-interview-questions）の内容をbot-stackのAPI経由で表示する
      - name: Build and embed the React app (想定問答)
        working-directory: app/interview-questions
        run: |
          npm ci
          npm run build
          rm -rf ../../site/education/interview-questions
          mkdir -p ../../site/education/interview-questions
          cp -r dist/. ../../site/education/interview-questions/

      # 模擬面接記録ページ（examination#103）。旧: knowledge/education/mock-interviews.mdへ
      # 手書きしていた記録をMkDocsで表示していたのをやめ、DynamoDB（examination-mock-interviews）
      # の内容をbot-stackのAPI経由で表示する
      - name: Build and embed the React app (模擬面接記録)
        working-directory: app/mock-interviews
        run: |
          npm ci
          npm run build
          rm -rf ../../site/education/mock-interviews
          mkdir -p ../../site/education/mock-interviews
          cp -r dist/. ../../site/education/mock-interviews/

      # プロフィール編集ページ（examination#125）。志望先の特色・その他前提情報の編集を
      # 音声対話ページから移設した専用画面
      - name: Build and embed the React app (プロフィール編集)
        working-directory: app/profile-edit
        run: |
          npm ci
          npm run build
          rm -rf ../../site/settings/profile-edit
          mkdir -p ../../site/settings/profile-edit
          cp -r dist/. ../../site/settings/profile-edit/

      # 教育セクションの概要ページ（examination#92）。鈴木家固有の情報（家族名入りの
      # チェックリスト等）を排除し、汎用的な方法論のみを残した。site/education/配下には
      # mkdocsが生成したmock-interviews/等の他ページや、既にビルド済みのinterview-questions/・
      # voice-practice/が既に存在するため、他ページのようなrm -rfは行わずcp -rのみで
      # index.htmlとアセットを上書きする
      - name: Build and embed the React app (教育概要)
        working-directory: app/education-overview
        run: |
          npm ci
          npm run build
          cp -r dist/. ../../site/education/

      # トップページ（examination#82）。/top/でのプレビュー確認を経て、MkDocsが生成した
      # サイトルート（/、knowledge/index.md）を正式に上書きする。site/配下の他のファイルは
      # そのまま残すため、他ページのようなrm -rfは行わずcp -rのみで上書きする。
      # 旧プレビューパス（/top/）はローカルsite/に生成されなくなるため、後段の
      # 「aws s3 sync --delete」でS3からも自動的に削除される
      - name: Build and embed the React app (トップページ)
        working-directory: app/top
        # VITE_で始まる環境変数はViteがimport.meta.env.VITE_*として自動的に公開する
        # （examination#131）。全アプリを同一コミットから一括ビルドするデプロイのため、
        # トップページのビルド情報をサイト全体のバージョン表示として扱う
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          export VITE_BUILD_SHA="${VITE_BUILD_SHA:0:7}"
          export VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm ci
          npm run build
          cp -r dist/. ../../site/

      # CloudFrontドメインは作成後不変。初回ブートストラップ以外は既存スタックの出力から
      # そのまま取得できる。初回はまだ存在しないためプレースホルダーにフォールバックする
      - name: Get current CloudFront domain (if the stack already exists)
        id: current-domain
        run: |
          DOMAIN=$(aws cloudformation describe-stacks --region us-east-1 --stack-name examination-site-prod \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text 2>/dev/null || true)
          echo "domain=${DOMAIN:-TBD.cloudfront.net}" >> "$GITHUB_OUTPUT"

      - name: Deploy auth-stack (Cognito)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v1.15.1
        with:
          working-directory: infra/auth-stack
          node-version: "24"
          deploy-command: >-
            npx serverless deploy
            --param="region=ap-northeast-1"
            --param="cognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX || 'bamiyanapp-examination' }}"
            --param="cloudFrontDomain=${{ steps.current-domain.outputs.domain }}"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Read auth-stack outputs
        id: auth-outputs
        run: |
          OUT=$(aws cloudformation describe-stacks --region ap-northeast-1 --stack-name examination-auth-prod --query "Stacks[0].Outputs")
          echo "user_pool_id=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "client_id=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="CognitoDomain") | .OutputValue')" >> "$GITHUB_OUTPUT"
          SECRET=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientSecret") | .OutputValue')
          echo "::add-mask::$SECRET"
          echo "client_secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Generate Lambda@Edge configuration
        working-directory: infra/site-stack
        env:
          AWS_REGION: ap-northeast-1
          COGNITO_USER_POOL_ID: ${{ steps.auth-outputs.outputs.user_pool_id }}
          COGNITO_CLIENT_ID: ${{ steps.auth-outputs.outputs.client_id }}
          COGNITO_CLIENT_SECRET: ${{ steps.auth-outputs.outputs.client_secret }}
          COGNITO_DOMAIN: ${{ steps.auth-outputs.outputs.cognito_domain }}
        run: node scripts/generate-config.js

      # --forceが無いと、functions/configuration.json（Secretから都度生成）だけが変わった
      # ケースをServerless Frameworkの変更検知が拾えず「No changes to deploy」でスキップされ、
      # OAuthシークレットのローテーション等がLambda@Edgeへ反映されないことがある（examination#51）
      - name: Deploy site-stack (S3 + CloudFront + Lambda@Edge)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v1.15.1
        with:
          working-directory: infra/site-stack
          node-version: "24"
          deploy-command: >-
            npx serverless deploy --force
            --param="bucketName=${{ vars.SITE_BUCKET_NAME || 'bamiyanapp-examination-knowledge' }}"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 許可メールアドレス一覧テーブルへの初期値投入。テーブルが空の場合のみ実行するため、
      # 既存ユーザーが/_admin/emailsで削除した後の再デプロイで復活することはない
      # （全件削除された場合のみ、次回デプロイで初期値に戻る＝締め出し防止の保険）
      - name: Seed initial allowed emails (only if table is empty)
        run: |
          COUNT=$(aws dynamodb scan --region us-east-1 --table-name examination-allowed-emails \
            --select COUNT --query "Count" --output text)
          if [ "$COUNT" = "0" ]; then
            echo "Seeding initial allowed emails"
            for EMAIL in "ttmyo135246@gmail.com" "ekusoy128@gmail.com" "s.ekusoy@gmail.com"; do
              aws dynamodb put-item --region us-east-1 --table-name examination-allowed-emails \
                --item "{\"email\": {\"S\": \"$EMAIL\"}, \"addedBy\": {\"S\": \"seed\"}, \"addedAt\": {\"S\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
            done
          else
            echo "Table already has $COUNT item(s), skipping seed"
          fi

      - name: Get real CloudFront domain
        id: real-domain
        run: |
          DOMAIN=$(aws cloudformation describe-stacks --region us-east-1 --stack-name examination-site-prod \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" --output text)
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      # 初回ブートストラップ時のみ、上のauth-stackデプロイ時点ではCloudFrontドメインが
      # プレースホルダーだったため、実ドメイン判明後にCallbackURLs/LogoutURLsを
      # 確定させるためもう一度deployする（2回目以降の通常デプロイでは差分が無いためスキップされる）
      - name: Re-deploy auth-stack with the real CloudFront domain (first-time bootstrap only)
        if: steps.current-domain.outputs.domain != steps.real-domain.outputs.domain
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v1.15.1
        with:
          working-directory: infra/auth-stack
          node-version: "24"
          deploy-command: >-
            npx serverless deploy
            --param="region=ap-northeast-1"
            --param="cognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX || 'bamiyanapp-examination' }}"
            --param="cloudFrontDomain=${{ steps.real-domain.outputs.domain }}"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Generate bot-stack configuration
        working-directory: infra/bot-stack
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # LINE bot・音声対話機能（examination#62）の両方でこのGemini APIキーを使う
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-config.js

      # --forceが無いと、functions/configuration.json（Secretから都度生成）だけが変わった
      # ケースをServerless Frameworkの変更検知が拾えず「No changes to deploy」でスキップされ、
      # LINE_CHANNEL_SECRET等の更新がLambdaへ反映されないことがある（examination#51で実際に発生）
      - name: Deploy bot-stack (LINE bot)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v1.15.1
        with:
          working-directory: infra/bot-stack
          node-version: "24"
          deploy-command: npx serverless deploy --force
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 想定問答テーブルへMarkdown（interview-yosuke/tomoyo/ritsu.md）の内容を同期する。
      # examination#77でDynamoDBを唯一の正本とする方針に変更したが、familySlug・category・
      # questionから決定的なquestionIdを生成する（scripts/seed-interview-questions.js）ため
      # 毎回実行しても同じ行を上書きするだけで重複は増えない。botの登録モード（saveQuestion、
      # 時刻+ランダム値のID）で追加された行とはID体系が異なり衝突しないため安全に共存できる。
      # 旧シードスクリプト（決定的ID導入以前）が投入した行はremoveLegacySeedRows()が
      # 初回実行時に自動的に削除する（createdBy="seed"かつ旧ID形式の行のみが対象で、
      # 登録モードで追加された行は誤って削除しない）
      - name: Sync interview questions from Markdown
        working-directory: infra/bot-stack
        env:
          # bot-stackはus-east-1に統一済み（examination#63）。他のAWS CLI呼び出しは
          # auth-stack（ap-northeast-1）向けのグローバル設定を引き継ぐため、
          # このステップのみ明示的に上書きする
          AWS_REGION: us-east-1
        run: node scripts/seed-interview-questions.js

      # knowledge/education/mock-interviews.mdの既存記録をDynamoDBへ一度きり移行する
      # （examination#93）。familySlug・createdAt・roleから決定的なsessionIdを生成する
      # ため、毎回実行しても同じ行を上書きするだけで重複は増えない。今後の新規記録は
      # 練習セッション終了時にlineWebhook.js/voiceChat.jsが直接DynamoDBへ保存するため、
      # このMarkdownファイル自体は今後更新しない
      - name: Sync mock interview records from Markdown (one-time migration)
        working-directory: infra/bot-stack
        env:
          AWS_REGION: us-east-1
        run: node scripts/seed-mock-interviews.js

      # Lambda Function URLの匿名アクセスがこのAWSアカウントでは403 Forbiddenになる問題
      # （examination#52）のため、実績のあるAPI Gateway（HTTP API）経由に切り替えた
      - name: Show LINE bot webhook URL
        run: |
          API_URL=$(aws cloudformation describe-stacks --region us-east-1 --stack-name examination-bot-prod \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)
          echo "### LINE bot Webhook URL" >> "$GITHUB_STEP_SUMMARY"
          echo "${API_URL}/webhook" >> "$GITHUB_STEP_SUMMARY"
          echo "（URLが変わった場合のみ、LINE Developers ConsoleのMessaging API設定でこのURLをWebhook URLとして再登録してください）" >> "$GITHUB_STEP_SUMMARY"

      # examination#72: 従来はCache-Controlを一切指定しておらず、S3オブジェクトに
      # ヘッダーが付与されないままだった。CloudFrontのDefaultCacheBehavior
      # （Managed-CachingOptimized）はオリジンがCache-Controlを返さない場合
      # DefaultTTL（1日）でエッジキャッシュし、さらにユーザーのブラウザ自体も
      # Last-Modified等からヒューリスティックに鮮度期間を独自算出してキャッシュする。
      # ホーム画面に追加した状態では通常のリロード操作が効きにくく、この
      # ブラウザキャッシュ（デプロイ時のCloudFrontキャッシュ無効化の対象外）が
      # 尽きるまで古いindex.htmlが使われ続け、結果的にアプリの削除・再インストール
      # でしか更新が反映されない状態になっていた。
      # 静的サイト配信の標準的な戦略として、ファイル名にコンテンツハッシュを含む
      # *assets/*配下（各Reactアプリ・MkDocs Materialテーマ）は内容が変われば
      # ファイル名自体が変わるため安全に長期不変キャッシュとし、それ以外
      # （index.html・search_index.json等、内容が変わってもファイル名が変わらない
      # もの）は毎回オリジンへ再検証させるno-cacheとする。ただしfaviconは
      # assets/配下にあってもファイル名を変えずに内容だけ更新した実績がある
      # （examination#67）ため、immutable対象から明示的に除外する
      - name: Sync site to S3
        run: |
          BUCKET="s3://${{ vars.SITE_BUCKET_NAME || 'bamiyanapp-examination-knowledge' }}"
          aws s3 sync site/ "$BUCKET" --delete \
            --exclude "*" --include "*assets/*" --exclude "*favicon*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync site/ "$BUCKET" --delete \
            --exclude "*assets/*" --include "*favicon*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks --region us-east-1 --stack-name examination-site-prod \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Show site URL
        run: |
          echo "### サイトURL" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ steps.real-domain.outputs.domain }}" >> "$GITHUB_STEP_SUMMARY"
