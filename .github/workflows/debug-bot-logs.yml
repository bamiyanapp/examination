name: Debug bot-stack Lambda logs

# LINE bot（infra/bot-stack）のトラブルシュートで、Lambdaが実際に呼ばれているか・
# 呼ばれた場合に何が起きているかをスマートフォンから確認するための診断用ワークフロー
# （examination#52）。手動実行のみで、通常のデプロイフローには影響しない
on:
  workflow_dispatch:
    inputs:
      since:
        description: "取得するログの範囲（例: 15m, 1h）"
        required: false
        default: "15m"

jobs:
  show-logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Show recent lineWebhook Lambda logs
        run: |
          SINCE="${{ github.event.inputs.since }}"
          echo "### examination-bot-prod-lineWebhook 直近ログ（過去${SINCE}）"
          echo "### examination-bot-prod-lineWebhook 直近ログ（過去${SINCE}）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          aws logs tail /aws/lambda/examination-bot-prod-lineWebhook --since "$SINCE" --format short \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "(ログの取得に失敗しました。ロググループが存在しないか、権限不足の可能性があります)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Lambda Function URLの匿名アクセスがAWS側で403 Forbiddenになる問題（examination#52）
      # を受けて、実績のあるAPI Gateway（HTTP API）経由に切り替えた。GitHub Actionsランナー
      # （インターネットに直接アクセス可能）から直接叩き、疎通を確認する
      - name: Check API Gateway endpoint connectivity
        run: |
          {
            API_URL=$(aws cloudformation describe-stacks --region ap-northeast-1 --stack-name examination-bot-prod \
              --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)
            WEBHOOK_URL="${API_URL}/webhook"
            echo "### Webhook URLへの直接リクエスト結果"
            echo "対象URL: $WEBHOOK_URL"
            echo '```'
            curl -s -D - -o /tmp/curl-body.txt -w "\nHTTP_STATUS:%{http_code}\n" \
              -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "x-line-signature: dummy-signature-for-diagnostic" \
              -d '{"events":[]}'
            echo "--- body ---"
            cat /tmp/curl-body.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
