<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>模擬面接記録 | 小学校受験対策</title>
    <style>
      #initial-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1f2937;
      }
      #initial-loading div {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid rgba(127, 127, 127, 0.3);
        border-top-color: currentColor;
        animation: initial-loading-spin 0.8s linear infinite;
      }
      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #initial-loading {
          background: #1d232a;
          color: #a6adbb;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" aria-hidden="true">
        <div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
