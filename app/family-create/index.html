<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>家族の新規作成 | 小学校受験対策</title>
    <script>
      // OS設定に追従したダークモード切り替え（daisyUIのdark --prefersdark相当）。
      // Bootstrap自体はdata-bs-theme属性でのダークモード切り替えを利用側に委ねている
      // （dev-standards docs/shared-ui-components.md）
      (function () {
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function applyTheme() {
          document.documentElement.setAttribute("data-bs-theme", media.matches ? "dark" : "light");
        }
        applyTheme();
        media.addEventListener("change", applyTheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
