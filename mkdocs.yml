site_name: 小学校受験対策
site_description: 家族向けナレッジサイト（Issue #4）
docs_dir: knowledge
repo_url: https://github.com/bamiyanapp/examination
repo_name: bamiyanapp/examination

theme:
  name: material
  language: ja
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ja

# 想定問答の元データ（examination#77でDynamoDBへ完全移行済み）。閲覧画面は
# app/interview-questions/（1画面）へ統合したため、この3ファイルは
# scripts/seed-interview-questions.jsが読み込む内部データソースとしてのみ残し、
# サイトのページとしては公開しない（navからも除外するとmkdocs strictモードが
# 「navに含まれないドキュメントがある」エラーを出すため、exclude_docsで明示的に除外する）
exclude_docs: |
  education/interview-yosuke.md
  education/interview-tomoyo.md
  education/interview-ritsu.md

nav:
  - ホーム: index.md
  - 教育:
      - 概要: education/index.md
      - 想定問答: education/interview-questions.md
      - 模擬面接記録: education/mock-interviews.md
      - 音声で面接練習: education/voice-practice.md
  - 設定:
      - 閲覧許可メールアドレス管理: settings/allowed-emails.md
      - LINE連携: settings/line-link.md
      - プロフィール編集: settings/profile-edit.md
